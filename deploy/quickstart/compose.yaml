# Keel PLM quickstart: the published image plus PostgreSQL, a SeaweedFS vault and a Keycloak sign-in, on one machine.
# Run ./setup.sh once first: it makes random secrets for every service and your own administrator account (it writes .env and generated/).
#
#   ./setup.sh && docker compose up -d       then open http://localhost:8080 and sign in as the administrator you chose
#
# Good for trials and small private teams. It is plain HTTP on this machine and the sign-in service runs in Keycloak's development mode, so for a site that
# others reach over a network follow docs/ops/compose-example.md (TLS, hardened containers, your own identity provider).
# KEEL_IMAGE picks a release (default: the latest). The host name keel.localhost reaches this machine from a browser, and from the app container via the
# extra_hosts entry, so the browser and the app see the same sign-in address. KEEL_PORT and KEEL_IDP_PORT (set before ./setup.sh) change the ports.
name: keel-quickstart

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: "${KEEL_PG_SUPERUSER_PASSWORD:?run ./setup.sh first}" }
    command: ["-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./generated/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d keel"], interval: 5s, retries: 30 }
    restart: unless-stopped

  vault:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json", "-bucket=keel-vault", "-admin.ui=false",
              "-master.volumeSizeLimitMB=256", "-master.telemetry=false"]
    volumes:
      - vaultdata:/data
      - ./generated/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEEL_KEYCLOAK_ADMIN_PASSWORD:?run ./setup.sh first}"
      KC_HOSTNAME: http://keel.localhost:${KEEL_IDP_PORT:-18080}
      KC_HEALTH_ENABLED: "true"
    ports: ["${KEEL_IDP_PORT:-18080}:8080"]
    volumes:
      - ./generated/keel-realm.json:/opt/keycloak/data/import/keel-realm.json:ro
      - keycloakdata:/opt/keycloak/data/h2
    depends_on: { keys: { condition: service_completed_successfully } }
    restart: unless-stopped

  # One-shot, first start: a fresh audit-checkpoint signing key, and the sign-in service's data folder made writable for its user.
  keys:
    image: alpine/openssl:latest
    entrypoint: ["/bin/sh", "-c", "test -f /keys/checkpoint-signing.pem || openssl ecparam -name prime256v1 -genkey -noout -out /keys/checkpoint-signing.pem; chmod 0644 /keys/checkpoint-signing.pem; chown -R 1000:0 /kc"]
    volumes: [keys:/keys, keycloakdata:/kc]

  # One-shot: applies the database migrations, then exits.
  migrate:
    image: &keel ${KEEL_IMAGE:-ghcr.io/finepointcgi/keel-plm:latest}
    command: ["--migrate"]
    environment:
      Keel__Database__MigratorConnectionString: "Host=postgres;Database=keel;Username=keel_migrator;Password=${KEEL_PG_MIGRATOR_PASSWORD:?run ./setup.sh first}"
      Keel__Database__AppConnectionString: "Host=postgres;Database=keel;Username=keel_app;Password=${KEEL_PG_APP_PASSWORD:?run ./setup.sh first}"
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  keel:
    image: *keel
    ports: ["${KEEL_PORT:-8080}:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Keel__Database__AppConnectionString: "Host=postgres;Database=keel;Username=keel_app;Password=${KEEL_PG_APP_PASSWORD:?run ./setup.sh first};Maximum Pool Size=40"
      Keel__Auth__Authority: http://keel.localhost:${KEEL_IDP_PORT:-18080}/realms/keel
      Keel__Auth__RequireHttpsMetadata: "false"
      Keel__Auth__WebClientSecret: "${KEEL_WEB_CLIENT_SECRET:?run ./setup.sh first}"
      Keel__Security__RequireFips: "false"
      Keel__Vault__ServiceUrl: http://vault:8333
      Keel__Vault__AccessKey: "${KEEL_VAULT_ACCESS_KEY:?run ./setup.sh first}"
      Keel__Vault__SecretKey: "${KEEL_VAULT_SECRET_KEY:?run ./setup.sh first}"
      Keel__Vault__Bucket: keel-vault
      Keel__Vault__ServerSideEncryption: "false"
      Keel__Vault__Scanning__Mode: Disabled
      Keel__Vault__Scanning__AcknowledgeUnscannedUploads: "true"
      Keel__Audit__CheckpointPrivateKeyPath: /keys/checkpoint-signing.pem
      Keel__Audit__CheckpointInterval: "00:05:00"
    extra_hosts: ["keel.localhost:host-gateway"]
    volumes: [keys:/keys:ro]
    depends_on:
      migrate: { condition: service_completed_successfully }
      keys: { condition: service_completed_successfully }
      vault: { condition: service_started }
      keycloak: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  vaultdata:
  keys:
  keycloakdata:
