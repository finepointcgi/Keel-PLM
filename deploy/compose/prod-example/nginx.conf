# Alternative reverse proxy for sites that need a FIPS-validated TLS stack on the proxy hop: nginx on Red Hat UBI 9 uses the
# RHEL OpenSSL (FIPS provider), while the Caddy image bundles Go's own TLS implementation. Use with
#   KEEL_PROXY_IMAGE=registry.access.redhat.com/ubi9/nginx-126@sha256:<pin it>
# and mount this file at /etc/nginx/nginx.conf in place of the Caddyfile (docs/ops/compose-example.md).
# Not exercised by the repository's tests: only the Caddy variant is.
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream keel_app {
    # With several replicas list them all and add: hash $cookie_keel_affinity consistent;  (Blazor circuits live on one replica.)
    server app:8080;
  }

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /certs/proxy.crt;
    ssl_certificate_key /certs/proxy.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    client_max_body_size 5g;
    proxy_request_buffering off;

    location = /metrics { return 404; }
    location /metrics/  { return 404; }

    location / {
      proxy_pass http://keel_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Upgrade $http_upgrade;       # Blazor Server uses WebSockets
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_buffering off;
    }
  }
}
