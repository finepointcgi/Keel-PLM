# Keel PLM development stack. Dev-only credentials; NOT a production deployment (see docs/setup.md, ADR-0012).
name: keel-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: keel_superuser_dev
    command: ["-c", "max_connections=300", "-c", "log_connections=on", "-c", "log_disconnections=on"]
    ports: ["127.0.0.1:${KEEL_PG_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keel"]
      interval: 5s
      retries: 20

  keycloak:
    # Dev/demo identity provider only (ADR-0007). Production uses the site IdP with CAC/PIV.
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keel_kc_admin_dev
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:${KEEL_IDP_PORT:-18080}:8080"]
    volumes:
      - ./keycloak/keel-realm.json:/opt/keycloak/data/import/keel-realm.json:ro

  vault:
    # Dev vault: SeaweedFS (Apache-2.0) behind the S3 API (A13, ADR-0015). The API only ever speaks S3, so production can
    # point at any S3-compatible store. Dev-only credentials live in seaweedfs/s3.json.
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json", "-bucket=keel-vault", "-admin.ui=false",
              "-master.volumeSizeLimitMB=256", "-master.telemetry=false"]
    ports: ["127.0.0.1:${KEEL_VAULT_PORT:-18333}:8333"]
    volumes:
      - vaultdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  vaultdata:
