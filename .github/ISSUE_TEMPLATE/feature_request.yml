name: Idea or feature request
description: Something that would make Keel better
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes: { label: What are you trying to do, description: "Describe the job and where it is hard today, not just the solution." }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would help }
