# The browser suite (Playwright + Chromium) against a throwaway stack the fixture starts itself (PostgreSQL, S3 store, Keycloak, the real host).
# Reusable: main.yml and nightly.yml run it whole (about 19 minutes), axe.yml runs only the accessibility class. Chromium is cached.
name: e2e

on:
  workflow_call:
    inputs:
      filter-class:
        description: "xUnit class filter passed to the runner; empty runs every E2E test"
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 60

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  KEEL_E2E: "1"

jobs:
  browser:
    name: Browser suite
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        run: dotnet build Keel.slnx -warnaserror
      # The Playwright version is pinned in Directory.Packages.props, so that file is the cache key: a new version downloads a new Chromium.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - name: Playwright browser (download only on a cache miss) and its system libraries
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          pwsh tests/Keel.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
          echo "browser cache hit: ${CACHE_HIT:-false}"
      - name: End-to-end tests
        env:
          FILTER_CLASS: ${{ inputs.filter-class }}
        run: |
          args=()
          if [[ -n "$FILTER_CLASS" ]]; then args+=(--filter-class "$FILTER_CLASS"); fi
          dotnet test --project tests/Keel.E2E --no-build "${args[@]}"
      - name: Keep the screenshots tracked by the repository unchanged
        if: always()
        run: git checkout -- docs/ux/screenshots docs/manual/images 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-traces
          path: TestResults/e2e
          if-no-files-found: ignore
          retention-days: 14
