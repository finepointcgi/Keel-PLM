# The operations proof: backup and restore drill (PostgreSQL dump + vault objects + audit chain), upgrade rehearsal from the previous migration set,
# and a load smoke. Each starts only throwaway containers with unique names (keel-drill-*) and removes them. Reusable; nightly.yml calls it.
name: drills

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  operations-proof:
    name: Backup and restore, upgrade rehearsal, load smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # the upgrade rehearsal reads the previous migration set from git history
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Production image (the drills run the real migrator, keel-audit and keel-vault from it)
        run: |
          set -a; source deploy/images.env; set +a
          docker build --target runtime -t keel/api:prodready \
            --build-arg SDK_IMAGE="$SDK_IMAGE" --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" .
          docker pull "$KEEL_POSTGRES_IMAGE" "$KEEL_VAULT_IMAGE" >/dev/null
          docker pull quay.io/keycloak/keycloak:26.4 >/dev/null
      - name: Backup and restore drill
        run: scripts/ops/backup-restore-drill.sh --report drill-reports/backup-restore.md
      - name: Upgrade rehearsal
        run: scripts/ops/upgrade-rehearsal.sh --report drill-reports/upgrade-rehearsal.md
      - name: Load smoke
        run: scripts/ops/load-smoke.sh --report drill-reports/load-smoke.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: drill-reports
          path: drill-reports
          if-no-files-found: ignore
          retention-days: 90
