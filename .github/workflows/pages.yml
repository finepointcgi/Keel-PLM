# Publishes the landing page (site/) and the documentation (docs/manual, docs/ops, docs/setup.md) to GitHub Pages with scripts/build-docs-site.py.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/manual/**", "docs/ops/**", "docs/setup.md", "scripts/build-docs-site.py", "scripts/docs-site/**", "src/Keel.Web/wwwroot/logo.svg"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the site
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet markdown==3.11.2
          .venv/bin/python scripts/build-docs-site.py _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
