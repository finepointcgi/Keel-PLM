# The fast set: everything a pull request must pass, and the first half of every main and nightly run (ADR-0059, docs/ops/ci.md).
# Reusable: pr.yml, main.yml and nightly.yml call it. Nothing here needs a browser; the integration job needs Docker (Testcontainers).
name: fast-checks

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-and-unit:
    name: Build (warnings are errors) and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        run: dotnet build Keel.slnx -warnaserror
      - name: Unit tests
        run: dotnet test --project tests/Keel.UnitTests --no-build

  integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Integration tests (Testcontainers starts PostgreSQL and the S3 store)
        run: |
          dotnet build Keel.slnx -warnaserror
          dotnet test --project tests/Keel.IntegrationTests --no-build

  openapi-drift:
    name: OpenAPI documents equal the committed ones
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Drift check
        run: scripts/update-openapi.sh --check

  docs:
    name: Markdown links (docs, manual, deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Link checker self-test
        run: scripts/ci/test-check-md-links.sh
      - name: Check relative links and anchors
        run: scripts/ci/check-md-links.py

  security:
    name: Secret scan, workflow lint, licence policy, dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # the history scan reads every commit
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Secret scan self-test and scan (tracked files and history)
        run: |
          scripts/ci/secret-scan.py --self-test
          scripts/ci/secret-scan.py --history
      - name: Workflow lint (and its self-test)
        run: |
          scripts/ci/test-lint-workflows.sh
          scripts/ci/lint-workflows.rb
      - name: Licence inventory is current and the licence policy holds
        run: scripts/generate-sbom.sh --check
      - name: Known-vulnerable dependencies (NuGet and npm advisories)
        run: scripts/ci/dependency-audit.sh

  sbom:
    name: SBOM (CycloneDX) from the real dependency graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Generate
        run: scripts/generate-sbom.sh --out sbom-out --version "0.0.0-ci.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom-out
          if-no-files-found: error
          retention-days: 30

  packaging:
    name: Helm chart and compose bundle checks, preflight tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Helm chart (lint, render, security properties)
        run: scripts/verify-helm.sh
      - name: Compose production bundle and preflight (static)
        run: scripts/verify-packaging.sh
